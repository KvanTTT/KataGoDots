# Configuration for the KataGoDots analysis engine
#
# Run the program using: `./katago analysis -config configs/analysis_dots.cfg -model <model>`
#
# The analysis engine answers JSON queries (one per line) with JSON responses (one per line),
# every query carrying the whole position, so no state is shared between them and several of them
# may be searched at once. Unlike the GTP engine it needs no synchronization with a client,
# and a query may be cancelled by its id, which is what an interactive analysis needs.

# ===========================================================================
# Game
# ===========================================================================
# Dots is a different game rather than a rules variant of Go: it decides the default rules of the engine,
# the default board size and the way the moves and the players are named. A query may override it
# with a `dots` field of its own, but the model has to be a Dots one either way.
dots = true

# ===========================================================================
# Logs
# ===========================================================================
# Each run of KataGo will log to a separate file in this dir
logDir = analysis_logs

# The queries and the responses are large, so they are not logged by default
# logAllRequests = true
# logAllResponses = true
logSearchInfo = false
logToStderr = false

# ===========================================================================
# Analysis
# ===========================================================================
# The evaluations are reported for the player to move, which is what an analysis of a Dots position needs:
# both players are analyzed by the very same query, only the player to move differs
reportAnalysisWinratesAs = SIDETOMOVE

# The default of a query that doesn't specify `maxVisits` of its own
maxVisits = 500

# How many positions are searched at once. Two of them let a client evaluate the next position
# while the previous one is still being reported
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 6

# The moves the engine plays itself (the `chosenMove` of a response) are varied by this,
# so that a Dots game against the engine doesn't repeat itself move by move
chosenMoveTemperature = 0.10
chosenMoveTemperatureEarly = 0.50

# ===========================================================================
# Neural net
# ===========================================================================
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 23
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true
